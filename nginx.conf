server {
    listen       8081;
    listen  [::]:8081;
    server_name  localhost;

    client_max_body_size 10M;
    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","version":"${APP_VERSION}"}';
    }

    # --- Proxy headers shared across all upstream locations ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Makeline service ---
    location /makeline/order/fetch {
        proxy_pass http://makeline-service:3001/order/fetch;
        proxy_http_version 1.1;
    }

    location ~ ^/makeline/order/(.+)$ {
        proxy_pass http://makeline-service:3001/order/$1;
        proxy_http_version 1.1;
    }

    location /makeline/order {
        proxy_pass http://makeline-service:3001/order;
        proxy_http_version 1.1;
    }

    # --- Order service ---
    location /order {
        proxy_pass http://order-service:3000/;
        proxy_http_version 1.1;
    }

    # --- Shipping service ---
    location /ship/ {
        proxy_pass http://shipping-service:3003/;
        proxy_http_version 1.1;
    }

    # --- Product service ---
    # Image upload must be matched before the generic /:id regex
    location = /product/upload {
        proxy_pass http://product-service:3002/upload;
        proxy_http_version 1.1;
    }

    location /products/ {
        proxy_pass http://product-service:3002/;
        proxy_http_version 1.1;
    }

    location /products {
        proxy_pass http://product-service:3002/;
        proxy_http_version 1.1;
    }

    # Matches /product/<id> and /product/<id>/anything (e.g. image)
    location ~ ^/product/(.+)$ {
        proxy_pass http://product-service:3002/$1;
        proxy_http_version 1.1;
    }

    location /product {
        proxy_pass http://product-service:3002/;
        proxy_http_version 1.1;
    }

    # --- AI service (via product-service) ---
    location /ai/ {
        proxy_pass http://product-service:3002/ai/;
        proxy_http_version 1.1;
    }
}